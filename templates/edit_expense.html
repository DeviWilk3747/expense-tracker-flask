<!DOCTYPE html>
<html>
    <head>
        <title>Edit Expense</title>
    </head>

    <body>
        <h1>Edit Expense</h1>

        <form action="/edit-expense/{{ expense[0] }}" method="POST">
            <label>Expense Name:</label>
            <input type="text" name="expense_name" value="{{ expense[1] }}" required>

            <br><br>

            <label>Cost:</label>
            <input type="number" name="cost" value="${{ expense[2] }}" step="0.01" min="0.01" required>

            <br><br>

            <label>Category:</label>
            <input type="text" name="category" value="{{ expense[3] }}" required>

            <button type="submit">Edit Expense</button>

            <br><br>

            <a href="/view-expenses">Cancel</a>
        </form>
    </body>
</html>
