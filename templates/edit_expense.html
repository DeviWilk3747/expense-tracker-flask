<!DOCTYPE html>
<html>
    <head>
        <title>Edit Expense</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>

    <body>
        <main class="container">
            <h1>Edit Expense</h1>

            {% if error %}
                <p>{{ error }}</p>
            {% endif %}

            <form action="/edit-expense/{{ expense[0] }}" method="POST">
                <div class="form-group">
                    <label for="expense_name">Expense Name:</label>
                    <input type="text" id="expense_name" name="expense_name" value="{{ expense[1] }}" required>
                </div>

                <div class="form-group">
                    <label for="cost">Cost:</label>
                    <input type="number" id="cost" name="cost" value="{{ expense[2] }}" step="0.01" min="0.01" required>
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <input type="text" id="category" name="category" value="{{ expense[3] }}" required>
                </div>

                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" value="{{ expense[4] }}" required>
                </div>

                <button type="submit" class="primary-button">Edit Expense</button>
                <a href="/view-expenses" class="secondary-link">Cancel</a>
                
            </form>

            
        </main>
    </body>
</html>
