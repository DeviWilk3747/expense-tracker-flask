{% extends "base.html" %}

{% block title %}
    Add Expense
{% endblock %}

{% block content %}

<h1>Add Expense</h1>
        
    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form action="/add-expense" method="POST">
        <div class="form-group">
            <label for="expense_name">Expense Name:</label>
            <input
                type="text"
                id="expense_name"
                name="expense_name"
                required
            >
        </div>

        <div class="form-group">
            <label for="cost">Cost:</label>
            <input
                type="number"
                id="cost"
                name="cost"
                step="0.01"
                min="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <input
                type="text"
                id="category"
                name="category"
                required
            >
        </div>

        <div class="form-group">
            <label for="date">Date:</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
        </div>

        <button type="submit" class="primary-button">Add Expense</button>
    </form>

    <br>

    <a href="/">Back to home</a>
{% endblock %}
