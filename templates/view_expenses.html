<!DOCTYPE html>
<html>
<head>
    <title>View Expenses</title>
</head>

<body>
    <h1>All Expenses</h1>

    {% for expense in expenses %}
        <p>
            ID: {{ expense [0] }} |
            Name: {{ expense[1] }} |
            Cost: {{ expense[2] }}
        </p>

        <form action="/delete-expense/{{ expense[0] }}" method="POST">
            <button type="submit">Delete</button>
        </form>
    {% endfor %}

    <br>

    <a href="/">Back to Home</a>

</body>

</html>
