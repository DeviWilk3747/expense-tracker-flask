<!DOCTYPE html>
<html>
<head>
    <title>View Expenses</title>
</head>

<body>
    <h1>All Expenses</h1>

    <h2>Filter Expenses</h2>

    <form action="/view-expenses" method="GET">
        <label>Category:</label>
        <input type="text" name="category" required>

        <button type="submit">Filter</button>
    </form>

    <br>

    <form action="/view-expenses" method="GET">
        <label>Expense Name:</label>
        <input type="text" name="search" required>

        <button type="submit">Search</button>
    </form>

    <h2>Sort Expenses</h2>

    <form action="/view-expenses" method="GET">
        <label>Sort by cost:</label>

        <select name="sort">
            <option value="cost_asc">Lowest to Highest</option>
            <option value="cost_desc">Highest to Lowest</option>
        </select>

        <button type="submit">Sort</button>
    </form>

    <br>

    {% for expense in expenses %}
        <p>
            ID: {{ expense [0] }} |
            Name: {{ expense[1] }} |
            Cost: ${{ "%.2f"|format(expense[2]) }} |
            Category: {{ expense[3] }}
        </p>

        <a href="/edit-expense/{{ expense[0] }}">Edit</a>

        <form action="/delete-expense/{{ expense[0] }}" method="POST">
            <button type="submit">Delete</button>
        </form>
    {% endfor %}
    
    <h2>Total Spending: ${{ "%.2f"|format(total) }}</h2>

    <br>

    <a href="/">Back to Home</a>

</body>

</html>
